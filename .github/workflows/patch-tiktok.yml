name: Patch TikTok 47.0.3 Arabic Hushfeed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-tiktok.yml'

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Arabic Hushfeed artifact
        uses: actions/download-artifact@v4
        with:
          name: Hushfeed-0.64.0-Arabic
          path: work
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36491025120

      - name: Verify MPP
        run: |
          test -f work/Hushfeed-0.64.0-Arabic.mpp
          sha256sum work/Hushfeed-0.64.0-Arabic.mpp

      - name: Download Morphe Desktop 1.17.0
        run: |
          curl -fL --retry 3 \
            -o work/morphe-desktop-1.17.0-all.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v1.17.0/morphe-desktop-1.17.0-all.jar
          echo "8cf6a9eab4ee9dab146bddc24681897851564f53116baec11f36ba2fa2f589be  work/morphe-desktop-1.17.0-all.jar" | sha256sum -c -

      - name: Download TikTok 47.0.3 from APKPure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          URLS=(
            "https://d.apkpure.com/b/XAPK/com.zhiliaoapp.musically?versionCode=2024700030"
            "https://d.apkpure.com/b/XAPK/com.zhiliaoapp.musically?version=47.0.3"
            "https://d.apkpure.com/b/APK/com.zhiliaoapp.musically?versionCode=2024700030"
          )
          ok=0
          for u in "${URLS[@]}"; do
            echo "Trying $u"
            rm -f work/TikTok-47.0.3.input
            if curl -fL --retry 2 -A "Mozilla/5.0" "$u" -o work/TikTok-47.0.3.input; then
              sz=$(stat -c%s work/TikTok-47.0.3.input || echo 0)
              echo "Downloaded $sz bytes"
              if [ "$sz" -gt 100000000 ]; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" = "1"
          file work/TikTok-47.0.3.input
          sha256sum work/TikTok-47.0.3.input
          if unzip -t work/TikTok-47.0.3.input >/dev/null 2>&1; then
            mv work/TikTok-47.0.3.input work/TikTok-47.0.3.xapk
            unzip -l work/TikTok-47.0.3.xapk | head -n 80
            unzip -p work/TikTok-47.0.3.xapk manifest.json 2>/dev/null | head -c 4000 || true
          else
            mv work/TikTok-47.0.3.input work/TikTok-47.0.3.apk
          fi

      - name: Patch TikTok unsigned
        run: |
          java -jar work/morphe-desktop-1.17.0-all.jar patch \
            -p work/Hushfeed-0.64.0-Arabic.mpp \
            --unsigned \
            --striplibs arm64-v8a \
            --bytecode-mode FULL \
            --verify-with-sdk /usr/local/lib/android/sdk \
            -o work/TikTok-47.0.3-Hushfeed-0.64.0-Arabic-UNSIGNED.apk \
            "$(test -f work/TikTok-47.0.3.xapk && echo work/TikTok-47.0.3.xapk || echo work/TikTok-47.0.3.apk)"
          ls -lh work/TikTok-47.0.3-Hushfeed-0.64.0-Arabic-UNSIGNED.apk
          sha256sum work/TikTok-47.0.3-Hushfeed-0.64.0-Arabic-UNSIGNED.apk > work/PATCHED-SHA256.txt

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-47.0.3-Hushfeed-0.64.0-Arabic-UNSIGNED
          path: |
            work/TikTok-47.0.3-Hushfeed-0.64.0-Arabic-UNSIGNED.apk
            work/PATCHED-SHA256.txt
          if-no-files-found: error
          retention-days: 3
